[project]
name = "beian-cli"
version = "0.1.0"
description = "CLI tool for querying ICP registration info from MIIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddddocr>=1.6.1",
    "playwright>=1.40",
]

[project.scripts]
beian = "beian.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["beian"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
